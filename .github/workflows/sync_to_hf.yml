name: Sync to Hugging Face hub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Clean up problematic binary files for HF
          rm -rf build/win32
          rm -rf resources/win32
          rm -rf resources/darwin
          rm -rf resources/linux
          rm -rf resources/server
          find . -name "*.exe" -type f -delete
          find . -name "*.ico" -type f -delete
          find . -name "*.icns" -type f -delete
          
          # 2. Setup git and commit the slim version
          git config --global user.email "bot@neptunium.ai"
          git config --global user.name "Neptunium Bot"
          git add .
          git commit -m "Slimming down for Hugging Face" || echo "No changes to commit"
          
          # 3. Push to the Space
          git push --force https://jessecodesometimes:$HF_TOKEN@huggingface.co/spaces/jessecodesometimes/Neptunium main
